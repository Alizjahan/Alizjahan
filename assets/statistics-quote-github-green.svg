<svg width="1000" height="180" viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E4429"/>
      <stop offset="50%" stop-color="#26A641"/>
      <stop offset="100%" stop-color="#39D353"/>
    </linearGradient>
    
    <clipPath id="typing-clip">
      <rect x="70" y="0" width="0" height="180">
        <animate id="typing" attributeName="width"
          begin="0s;typing.end"
          dur="5.5s"
          values="0; 860; 860; 0"
          keyTimes="0; 0.62; 0.84; 1"
          fill="remove" />
      </rect>
    </clipPath>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <g clip-path="url(#typing-clip)">
    <text
      x="50%"
      y="58%"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="58"
      font-weight="800"
      fill="url(#gradient)">
      YOUR OPINION IS NOT P &lt; 0.05
    </text>
  </g>
</svg>
